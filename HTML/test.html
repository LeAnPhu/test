<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORM</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="D:/Code/New/Css/new.css" />
  </head>
  <body class="bg-body-tertiary">
    <h1>FORM</h1>
    <h3>Test branch</h3>
    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <form
            action="#"
            method="POST"
            class="form-control p-4 p-md-5 rounded-4 shadow-sm border"
          >
            <div class="row mb-3 align-items-center">
              <label for="email" class="col-sm-4 col-form-label fw-semibold"
                >Email</label
              >
              <div class="col-sm-8">
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  placeholder="Nhập email..."
                  required
                />
              </div>
            </div>

            <div class="row mb-3 align-items-center">
              <label for="password" class="col-sm-4 col-form-label fw-semibold"
                >Password</label
              >
              <div class="col-sm-8">
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  placeholder="Nhập password..."
                  required
                />
              </div>
            </div>

            <div class="row mb-3 align-items-center">
              <div class="col-sm-4">Radio</div>
              <div class="col-sm-8">
                <div class="form-check mb-1">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="radioGroup"
                    id="first"
                    checked
                  />
                  <label class="form-check-label" for="first"
                    >First radio</label
                  >
                </div>
                <div class="form-check mb-1">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="radioGroup"
                    id="second"
                  />
                  <label class="form-check-label" for="second"
                    >Second radio</label
                  >
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="radioGroup"
                    id="third"
                    disabled
                  />
                  <label class="form-check-label" for="third"
                    >Third radio (Disabled)</label
                  >
                </div>
              </div>
            </div>

            <div class="row mb-4">
              <div class="col-sm-4">Checkbox</div>
              <div class="col-sm-8 offset-sm-4">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="exampleCheck"
                  />
                  <label class="form-check-label" for="exampleCheck"
                    >Example checkbox</label
                  >
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-sm-8 offset-sm-4">
                <button type="submit" class="btn btn-primary px-4 fw-semibold">
                  Sign in test
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
